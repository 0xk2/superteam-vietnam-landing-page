[build]
  command = "npm run build"
  publish = "dist"

# Build Station projects are now submitted through the Road to Colosseum form.
[[redirects]]
  from = "/danang-buildstation/submit/*"
  to = "https://forms.gle/MaCQbiJqtTDyuDvu8"
  status = 302
  force = true

# Reports used to live under /report/; keep old links working.
[[redirects]]
  from = "/report/*"
  to = "/reports/:splat"
  status = 301
  force = true

# Road to Colosseum report, a static site copied verbatim from public/reports/rtc.
[[headers]]
  for = "/reports/rtc/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Build Station: Winter Challenge lives at /winter-challenge/. Send the ways
# people type or say it ("Winter Challenge", WinterChallenge, /winter) there.
[[redirects]]
  from = "/Winter%20Challenge/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[redirects]]
  from = "/winter%20challenge/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[redirects]]
  from = "/Winter-Challenge/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[redirects]]
  from = "/WinterChallenge/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[redirects]]
  from = "/winterchallenge/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[redirects]]
  from = "/winter/*"
  to = "/winter-challenge/"
  status = 301
  force = true

[[headers]]
  for = "/winter-challenge/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
