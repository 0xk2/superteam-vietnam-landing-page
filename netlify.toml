[build]
  command = "npm run build"
  publish = "dist"

# Build Station projects are now submitted through the Road to Colosseum form.
[[redirects]]
  from = "/danang-buildstation/submit/*"
  to = "https://forms.gle/MaCQbiJqtTDyuDvu8"
  status = 302
  force = true

# Road to Colosseum report, a static site copied verbatim from public/report/rtc.
[[headers]]
  for = "/report/rtc/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
